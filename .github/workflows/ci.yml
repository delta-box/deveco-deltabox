name: DevEco Deltabox

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm pack --dry-run

  host-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch pinned DevEco host
        run: |
          git clone --no-checkout https://gitcode.com/openharmony-sig/deveco-code.git "$RUNNER_TEMP/deveco-code"
          git -C "$RUNNER_TEMP/deveco-code" checkout --detach abc2d62370d46e7102828eb9e1f1783f0dd7474f
      - run: node host/setup.mjs --source "$RUNNER_TEMP/deveco-code" --check
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Apply host patch and install bundled adapter
        run: |
          git -C "$RUNNER_TEMP/deveco-code" apply "$GITHUB_WORKSPACE/host/deveco-code.patch"
          node --input-type=module -e 'import { installAdapter } from "./host/adapter.mjs"; installAdapter(process.env.RUNNER_TEMP + "/deveco-code")'
      - name: Install host dependencies
        working-directory: ${{ runner.temp }}/deveco-code
        run: bun install --frozen-lockfile
      - name: Check bundled adapter types
        working-directory: ${{ runner.temp }}/deveco-code/packages/opencode
        run: bun typecheck
      - name: Test mounted language services and plugin loading
        working-directory: ${{ runner.temp }}/deveco-code/packages/opencode
        run: bun test --timeout 30000 test/plugin/deltabox-language.test.ts test/plugin/deltabox.test.ts test/plugin/deltabox-review.test.ts
